# ==================================================
# Application & Environment Settings
# ==================================================
baseUrl=https://opensource-demo.orangehrmlive.com/web/index.php/auth/login
environment=QA

# ==================================================
# Browser Configuration
# Options: chrome, firefox, edge
# ==================================================
browser=chrome
headless=false

# ==================================================
# Timeout Settings (in seconds)
# ==================================================
implicitWait=10
explicitWait=15
pageLoadTimeout=30

# ==================================================
# Test Data Settings
# ==================================================
excelFilePath=src/test/resources/testdata/LoginData.xlsx
excelSheetName=Sheet1

# ==================================================
# Reporting & Screenshot Settings
# ==================================================
screenshotOnFailure=true
allureResultsDirectory=target/allure-results